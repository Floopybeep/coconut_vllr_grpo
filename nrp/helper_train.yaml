apiVersion: v1
kind: Pod
metadata:
  name: helper-train
  namespace: wcsng-log
spec:
  containers:
  - name: helper-train
    image: pytorch/pytorch:2.11.0-cuda12.6-cudnn9-runtime
    command:
      - "sleep"
      - "infinity"
    resources:
      requests:
        cpu: "500m"      # Half a core
        memory: "2Gi"    # 2 Gigabytes
      limits:
        cpu: "1000m"     # 1 full core (or higher)
        memory: "4Gi"    # 4 Gigabytes (recommended for VS Code)
    volumeMounts:
    - name: storage-volume
      mountPath: /workspace
  volumes:
  - name: storage-volume
    persistentVolumeClaim:
      claimName: train-pvc


